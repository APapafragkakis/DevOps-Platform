name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

env:
  RELEASE: devops-platform
  NAMESPACE: devops-platform
  HELM_VERSION: v4.3.2

jobs:
  check:
    name: Check deploy config
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    outputs:
      staging: ${{ steps.check.outputs.staging }}
      production: ${{ steps.check.outputs.production }}
    steps:
      - id: check
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
          KUBE_CONFIG_PROD: ${{ secrets.KUBE_CONFIG_PROD }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          staging=false
          production=false
          if [ -n "$KUBE_CONFIG_STAGING" ] && [ -n "$STAGING_URL" ]; then
            staging=true
          fi
          if [ -n "$KUBE_CONFIG_PROD" ] && [ -n "$PROD_URL" ]; then
            production=true
          fi
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "production=$production" >> "$GITHUB_OUTPUT"
          echo "staging deploy: $staging, production deploy: $production" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.staging == 'true'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-platform" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Helm upgrade
        run: |
          helm upgrade "$RELEASE" ./helm/devops-platform \
            -n "$NAMESPACE-staging" \
            --reuse-values \
            --set image.repository="$IMAGE" \
            --set image.tag="$IMAGE_TAG" \
            --wait --timeout 3m

      - name: Smoke test
        run: curl -sf --retry 5 --retry-delay 5 "${{ vars.STAGING_URL }}/health"

      - name: Rollback
        if: failure()
        run: helm rollback "$RELEASE" -n "$NAMESPACE-staging" --wait --timeout 3m || true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [check, deploy-staging]
    if: needs.check.outputs.production == 'true'
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-platform" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Helm upgrade
        run: |
          helm upgrade "$RELEASE" ./helm/devops-platform \
            -n "$NAMESPACE" \
            --reuse-values \
            --set image.repository="$IMAGE" \
            --set image.tag="$IMAGE_TAG" \
            --wait --timeout 3m

      - name: Smoke test
        run: curl -sf --retry 5 --retry-delay 5 "${{ vars.PROD_URL }}/health"

      - name: Rollback
        if: failure()
        run: helm rollback "$RELEASE" -n "$NAMESPACE" --wait --timeout 3m || true
