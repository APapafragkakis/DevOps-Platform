name: CI

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install flake8==7.5.0
      - run: flake8 app/ --max-line-length=100 --exclude=app/tests,app/migrations

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: devops
          POSTGRES_DB: devopsdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d devopsdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://devops:devops@localhost:5432/devopsdb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements-dev.txt
      - name: Run migrations
        working-directory: app
        run: alembic upgrade head
      - name: Check models match migrations
        working-directory: app
        run: alembic check
      - name: Run tests
        run: pytest app/tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=85

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./app
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v7
      - name: Start app with postgres and redis
        run: docker compose up -d --build --wait --wait-timeout 180 app
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 smoke test
        run: k6 run load-tests/smoke.js
      - name: App logs
        if: failure()
        run: docker compose logs app
      - name: Stop services
        if: always()
        run: docker compose down -v

  e2e:
    name: Kubernetes E2E
    runs-on: ubuntu-latest
    needs: [test, security]
    env:
      NAMESPACE: devops-platform
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t devops-platform:e2e ./app

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devops-platform:e2e
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2

      - name: Helm lint
        run: helm lint ./helm/devops-platform

      - uses: helm/kind-action@v1
        with:
          cluster_name: e2e

      - name: Load image into kind
        run: kind load docker-image devops-platform:e2e --name e2e

      - name: Generate throwaway credentials
        run: |
          DB_PASSWORD=$(openssl rand -hex 16)
          APP_SECRET_KEY=$(openssl rand -hex 32)
          E2E_USER_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$APP_SECRET_KEY"
          echo "::add-mask::$E2E_USER_PASSWORD"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "APP_SECRET_KEY=$APP_SECRET_KEY" >> "$GITHUB_ENV"
          echo "E2E_USER_PASSWORD=$E2E_USER_PASSWORD" >> "$GITHUB_ENV"

      - name: Deploy Postgres and Redis
        run: |
          kubectl create namespace "$NAMESPACE"
          kubectl create secret generic postgres-auth -n "$NAMESPACE" --from-literal=password="$DB_PASSWORD"
          kubectl apply -n "$NAMESPACE" -f k8s/e2e-deps.yaml
          kubectl rollout status -n "$NAMESPACE" deployment/postgres --timeout=180s
          kubectl rollout status -n "$NAMESPACE" deployment/redis --timeout=180s

      - name: Helm install
        run: |
          helm install devops-platform ./helm/devops-platform \
            -n "$NAMESPACE" \
            --set image.repository=devops-platform \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set ingress.enabled=false \
            --set secrets.databaseUrl="postgresql://devops:$DB_PASSWORD@postgres:5432/devopsdb" \
            --set secrets.redisUrl="redis://redis:6379/0" \
            --set secrets.secretKey="$APP_SECRET_KEY" \
            --wait --timeout 5m

      - name: Helm upgrade (same command as CD)
        run: |
          helm upgrade devops-platform ./helm/devops-platform \
            -n "$NAMESPACE" \
            --reuse-values \
            --set image.tag=e2e \
            --wait --timeout 5m

      - name: Smoke test
        run: |
          kubectl port-forward -n "$NAMESPACE" svc/devops-platform 8080:80 > /tmp/port-forward.log 2>&1 &
          URL=http://localhost:8080

          curl -sf --retry 10 --retry-connrefused --retry-delay 2 "$URL/health"
          jq -n --arg password "$E2E_USER_PASSWORD" '{username: "e2e", password: $password}' \
            | curl -sf -X POST "$URL/auth/register" -H "Content-Type: application/json" -d @-
          TOKEN=$(curl -sf -X POST "$URL/auth/token" \
            --data-urlencode "username=e2e" \
            --data-urlencode "password=$E2E_USER_PASSWORD" | jq -r .access_token)
          curl -sf -X POST "$URL/items" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name": "e2e item"}'
          curl -sf "$URL/items" -H "Authorization: Bearer $TOKEN" | jq -e 'length == 1'

      - name: Debug info
        if: failure()
        run: |
          if ! kubectl cluster-info > /dev/null 2>&1; then
            echo "no cluster, failed before kind was created"
            exit 0
          fi
          kubectl get all -n "$NAMESPACE"
          kubectl describe pods -n "$NAMESPACE" -l app=devops-platform
          kubectl logs -n "$NAMESPACE" -l app=devops-platform --tail=100 --all-containers

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [load-test, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-platform" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
